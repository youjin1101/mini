<!DOCTYPE html>
<html lang="ko">
<head>
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 10px;
        display: flex;
        justify-content: center;
        background: #f5f5f5;
    }

    canvas {
        background: rgb(243, 245, 117);
        display: block;
        width: 100%;
        max-width: 600px;
        height: auto;
        touch-action: none;
    }

    @media screen and (max-width: 600px) {
        body {
            padding: 5px;
        }

        canvas {
            width: 100%;
        }
    }
    </style>
</head>
<body>
    <canvas id="myCanvas" width="600" height="400"></canvas>
    <script>

        // 캔버스 객체를 찾아서 변수 canvas에 저장

        let canvas = document.getElementById("myCanvas");

        // 컨텍스트 객체를 얻는다.
        let context = canvas.getContext("2d");
        let brickRows = 3;          // 벽돌의 총 행 수
        let brickColumns = 5;       // 벽돌의 총 열 수
        let brickWidth = 75;        // 벽돌 1개의 폭
        let brickHeight = 20;       // 벽돌 1개의 높이
        let brickPadding = 10;      // 벽돌 사이의 간격
        let brickStartX = 30;       // 화면에서 벽돌이 시작되는 위치
        let brickStartY = 50;       // 화면에서 벽돌이 시작되는 위치
        let bricks = new Array(brickRows); // 크기가 brickRows인 배열을 생성한다.
        let lives = 3;
        let score = 0;
        let gameOver = false;
        let interval;
        let ball = {
            x: canvas.width / 2,    // 공의 x좌표
            y: canvas.height - 30,  // 공의 y좌표
            dx: 2,                  // 공의 x 방향 속도
            dy: -2,                 // 공의 y 방향 속도
            radius: 10,             // 공의 반지름
            draw: function() {      // 공을 화면에 그리는 메소드
                context.beginPath();
                context.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                context.fillStyle = "#000000";
                context.fill();
                context.closePath();
            }
        };
        let paddle = {              // 패들을 객체로 정의한다.
            height: 10,             // 패들의 높이
            width: 90,              // 패들의 폭
            x: 300,                 // 패들의 x좌표
            draw: function() {      // 패들을 화면에 그리는 함수
                context.beginPath();
                context.rect(
                    this.x,
                    canvas.height - this.height,
                    this.width,
                    this.height
                );

                context.fillStyle = "blue";
                context.fill();
                context.closePath();
            }

        };
        function drawInfo() {
            context.font = "20px Arial";
            context.fillStyle = "black";
            context.textAlign = "left";
            context.fillText("Lives: " + lives, 10, 25);
            context.textAlign = "right";
            context.fillText("Score: " + score, 590, 25);
            context.textAlign = "left";
        }
        class Brick {
            constructor(x, y, hits) {
                this.x = x;
                this.y = y;
                this.hits = hits;
                this.maxHits = hits;
                this.status = 1;  // 벽돌의 상태 초기화 (1: 살아 있음)
            }

            draw() {
                if (this.status === 1) {
                    context.beginPath();
                    context.rect(
                        this.x,
                        this.y,
                        brickWidth,
                        brickHeight
                    );

                    // 내구도에 따라 벽돌 색상 설정
                    if (this.maxHits === 2) {
                        context.fillStyle = this.hits === 2 ? "red" : "orange";
                    } else {
                        context.fillStyle = "brown";
                    }

                    context.fill();
                    context.closePath();
                }
            }

            check() {
                if (this.status === 1) {
                    if (
                        ball.x > this.x &&
                        ball.x < this.x + brickWidth &&
                        ball.y > this.y &&
                        ball.y < this.y + brickHeight
                    ) {
                        ball.dy = -ball.dy;
                        this.hits--;

                        if (this.hits <= 0) {
                            this.status = 0;  // 벽돌 제거
                            score += 10;
                        }
                    }
                }
            }
        }

        function init() {
            // PC 마우스 조작
            canvas.addEventListener("mousemove", mouseHandler);

            // 모바일 터치 조작
            canvas.addEventListener("touchstart", touchHandler, {
                passive: false
            });
            canvas.addEventListener("touchmove", touchHandler, {
                passive: false
            });

            for (let r = 0; r < brickRows; r++) {
                bricks[r] = new Array(brickColumns);

                for (let c = 0; c < brickColumns; c++) {
                    let brickX =
                        c * (brickWidth + brickPadding) + brickStartX;
                    let brickY =
                        r * (brickHeight + brickPadding) + brickStartY;

                    let strength = (r + c) % 3 === 0 ? 2 : 1;
                    bricks[r][c] = new Brick(brickX, brickY, strength);
                }
            }
        }

        function movePaddle(clientX) {
            let rect = canvas.getBoundingClientRect();

            // 화면에 표시된 캔버스 좌표를 게임 내부 좌표로 변환
            let x = (clientX - rect.left) * (canvas.width / rect.width);

            paddle.x = x - paddle.width / 2;
            paddle.x = Math.max(
                0,
                Math.min(canvas.width - paddle.width, paddle.x)
            );
        }

        function mouseHandler(e) {
            movePaddle(e.clientX);
        }

        function touchHandler(e) {
            e.preventDefault();

            if (e.touches.length > 0) {
                movePaddle(e.touches[0].clientX);
            }
        }
        function resetBall() {
            ball.x = canvas.width /2;
            ball.y = canvas.height - 30;
            ball.dx = 2;
            ball.dy = -2;
            paddle.x = (canvas.width-paddle.width)/2;
        }
        function showGameOver() {
            context.fillStyle = "black";
            context.font = "36px Arial";
            context.textAlign = "center";
            context.fillText(
                "GAME OVER", canvas.width/2, canvas.height /2
            );
        }

        function gameLoop() {       // 게임 루프 함수
            context.clearRect(0, 0, canvas.width, canvas.height); // 화면을 지운다.
            drawInfo();
            ball.draw();             // 화면에 공을 그린다.
            paddle.draw();           // 화면에 패들을 그린다.
            for (let r = 0; r < brickRows; r++) {
                for (let c = 0; c < brickColumns; c++) { // 각 벽돌에 대하여
                    bricks[r][c].check(); // 충돌 검사를 한다.
                    bricks[r][c].draw();  // 벽돌을 화면에 그린다.
                }
            }
            // 공이 화면의 왼쪽이나 오른쪽에 도달하였으면 방향을 바꾼다.
            if (
                ball.x + ball.dx > canvas.width - ball.radius ||
                ball.x + ball.dx < ball.radius
            ) {
                ball.dx = -ball.dx;
            }
            // 공이 화면의 위쪽에 도달하였으면 방향을 바꾼다.
            if (ball.y + ball.dy < ball.radius) {
                ball.dy = -ball.dy;
            }
            // 공이 화면의 아래쪽에 도달하였으면 패들과 충돌을 검사한다.
            else if (ball.y + ball.dy > canvas.height - ball.radius) {
                if (
                    ball.x >= paddle.x &&
                    ball.x <= paddle.x + paddle.width
                ) {
                    ball.dy = -Math.abs(ball.dy);
                }
                else {
                    lives--;
                    if (lives<=0) {
                        lives=0;
                        gameOver = true;
                        clearInterval(interval);
                        drawInfo();
                        showGameOver();
                        return;
                    }
                    resetBall();
                    drawInfo();
                    return;
                }
            }
            ball.x += ball.dx; // 공의 위치를 변경한다.
            ball.y += ball.dy;
        }
        init();
        interval = setInterval(gameLoop, 10); // 10밀리초마다 gameLoop()를 호출한다.

    </script>

</body>

</html>
